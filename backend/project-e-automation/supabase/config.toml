project_id = "lexon-automation"

# Deploy these functions to the AUTOMATION project (E):  supabase link --project-ref <E ref> && supabase functions deploy
# Public callbacks (no login possible): protected by HMAC signature (Meta) or signed state (OAuth).
[functions.ig-webhook]
verify_jwt = false
[functions.ig-oauth]
verify_jwt = false
[functions.youtube-oauth]
verify_jwt = false   # POST path checks the service key itself; GET path is Google's redirect
# Private: Supabase also requires E's service_role key as the Bearer token.
[functions.ig-api]
verify_jwt = true
[functions.youtube-sync]
verify_jwt = true
[functions.youtube-ai]
verify_jwt = true
