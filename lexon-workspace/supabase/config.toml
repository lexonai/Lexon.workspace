# Supabase CLI config (functions). Deploy: supabase functions deploy <name>
[functions.integrations-oauth]
verify_jwt = false   # provider redirects here without a JWT; the function verifies a signed state itself

[functions.project-gateway]
verify_jwt = true

[functions.invite-member]
verify_jwt = true

[functions.ai-keys]
verify_jwt = true

[functions.assistant]
verify_jwt = true

[functions.office-ai]
verify_jwt = false   # called server-to-server by the Office project; the function checks the x-office-secret header itself

[functions.office-sso]
verify_jwt = true
