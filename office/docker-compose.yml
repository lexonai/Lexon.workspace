services:
  office:
    build: .
    ports: ["8787:8787"]
    environment:
      OFFICE_SSO_SECRET: ${OFFICE_SSO_SECRET}
      OFFICE_GATEWAY_SECRET: ${OFFICE_GATEWAY_SECRET}
      WORKSPACE_FUNCTIONS_URL: ${WORKSPACE_FUNCTIONS_URL}
      OFFICE_FRAME_ANCESTORS: ${OFFICE_FRAME_ANCESTORS}
    volumes: ["./data:/app/data"]
    restart: unless-stopped
