<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>LEXON OFFICE Admin</title><meta name="theme-color" content="#09090b">
<style>:root{--bg:#09090b;--p:#101114;--p2:#16181c;--line:#24272d;--tx:#e8eaed;--mu:#8b919b;--b:#3b82f6;--g:#3ddc84;--y:#f5c542;--r:#ef4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:14px/1.45 system-ui,sans-serif;padding-bottom:64px}
button,input,textarea,select{font:inherit;color:inherit;background:var(--p2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}button{cursor:pointer}button.pri{background:var(--b);border-color:var(--b)}input,textarea,select{width:100%}small{color:var(--mu);display:block}
header{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--line);background:var(--p);position:sticky;top:0}main{padding:14px;max-width:720px;margin:0 auto}
nav{position:fixed;bottom:0;left:0;right:0;display:flex;background:var(--p);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}nav button{flex:1;border:0;border-radius:0;background:transparent;color:var(--mu);padding:14px 4px;font-size:12px}nav button.on{color:var(--tx);box-shadow:inset 0 2px var(--b)}
.card{background:var(--p);border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:10px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:6px}
.bub{max-width:85%;margin:6px 0;padding:9px 12px;border-radius:14px;background:#1c1f24;white-space:pre-wrap}.bub.me{margin-left:auto;background:#173a68}.bar{height:4px;background:#22252b;border-radius:3px;margin-top:6px}.bar i{display:block;height:100%;background:var(--b);border-radius:3px}img{max-width:100%;border-radius:10px}
#login{padding:30px 20px;max-width:380px;margin:12vh auto}#login input{margin:10px 0}.row{display:flex;gap:8px}.row input{flex:1}</style></head><body>
<div id="login"><h2>LEXON OFFICE</h2><small>Admin portal</small><input id="un" placeholder="Username (default: owner)" autocapitalize="off"><input id="pw" type="password" placeholder="Password"><button class="pri" style="width:100%" onclick="login()">Log in</button><small id="err" style="color:var(--r)"></small></div>
<div id="app" hidden><header><b>LEXON OFFICE</b><span id="stat" style="color:var(--g)">● live</span></header><main id="v"></main>
<nav><button data-t="overview">Overview</button><button data-t="chat">Chat</button><button data-t="tasks">Tasks</button><button data-t="activity">Activity</button><button data-t="schedule">Schedule</button></nav></div>
<script>
let T=localStorage.getItem('om.t')||'',S=null,tab='overview',es,speakOn=false,conv='manager';const $=q=>document.querySelector(q),esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const H=()=>({'content-type':'application/json',authorization:'Bearer '+T}),api=(p,b)=>fetch(p,{method:b?'POST':'GET',headers:H(),body:b?JSON.stringify(b):undefined}).then(r=>r.json())
async function login(){const r=await fetch('/api/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({username:$('#un').value.trim()||'owner',password:$('#pw').value})}),j=await r.json();if(!r.ok){$('#err').textContent=j.error;return}T=j.token;localStorage.setItem('om.t',T);start()}
function start(){$('#login').hidden=true;$('#app').hidden=false;es?.close();es=new EventSource('/api/events?mask=1&token='+T);es.onmessage=e=>{const prev=S;S=JSON.parse(e.data).state;$('#stat').textContent='● live';if(prev&&speakOn){const a=(prev.messages.manager||[]).length,m=(S.messages.manager||[]);m.slice(a).filter(x=>x.from!=='owner'&&!x.system).forEach(x=>speechSynthesis.speak(new SpeechSynthesisUtterance(x.text.slice(0,300))))}draw()};es.onerror=()=>{$('#stat').textContent='● offline';if(!S)logout()}}
function logout(){localStorage.removeItem('om.t');location.reload()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;draw()})
const pc={online:'#3ddc84',away:'#f5c542',busy:'#ef4444',offline:'#6b7280'},cur=id=>(S.tasks.find(t=>(t.status==='working'||t.status==='review')&&t.chain.includes(id))||{}).title||'—',tm=t=>new Date(t).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})
const ROOMS={design:'Design Room',dev:'Development Room',youtube:'YouTube Room',content:'Content Room',meeting:'Meeting Room',main:'Main Floor',break:'Break Area'}
function draw(){if(!S)return;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.t===tab));const v=$('#v'),ppl=Object.values(S.people),open=S.tasks.filter(t=>t.status!=='done').length,keep=document.activeElement&&document.activeElement.id;let h=''
if(tab==='overview'){h+=`<div class="grid"><div class="card"><small>Online</small><b style="font-size:24px">${ppl.filter(p=>p.presence==='online').length}/${ppl.length}</b></div><div class="card"><small>Open tasks</small><b style="font-size:24px">${open}</b></div></div><h3>Office overview</h3><div class="grid">`+Object.entries(ROOMS).slice(0,6).map(([k,n],i)=>`<div class="card"><small>CAM 0${i+1}</small><b>${n}</b><small>${ppl.filter(p=>p.room===k).map(p=>p.name.split(' ')[0]).join(', ')||'Empty'}</small></div>`).join('')+`</div><small>Live 3D cameras are on the desktop app.</small><h3>Employees</h3>`+ppl.map(p=>`<div class="card"><span class="dot" style="background:${pc[p.presence]}"></span><b>${esc(p.name)}</b> <small style="display:inline">${esc(p.role)}</small><small>${esc(cur(p.id))}</small></div>`).join('')+`<h3>Notifications</h3>`+S.notifications.slice(0,8).map(n=>`<div class="card"><small>${tm(n.t)}</small>${esc(n.text)}</div>`).join('')+`<button onclick="logout()">Log out</button>`}
if(tab==='chat'){const m=S.messages[conv]||[];h+=`<select onchange="conv=this.value;draw()" style="margin-bottom:8px"><option value="manager">${esc((ppl.find(p=>p.isManager)||{}).name||'Manager')} (Manager)</option>${ppl.filter(p=>!p.isManager).map(p=>`<option value="${p.id}" ${conv===p.id?'selected':''}>${esc(p.name)}${S.unread[p.id]?' ('+S.unread[p.id]+')':''}</option>`).join('')}</select>`;h+=m.map(x=>x.system?`<small style="text-align:center">${esc(x.text)}</small>`:`<div class="bub ${x.from==='owner'?'me':''}">${esc(x.text)}${x.output&&x.output.imageUrl?`<img src="${esc(x.output.imageUrl)}">`:''}<small>${tm(x.t)}</small></div>`).join('')||'<small>Message the Manager.</small>';h+=`<div class="row" style="margin-top:12px"><input id="msg" placeholder="Message the Manager…"><button onclick="mic()">🎙</button><button class="pri" onclick="sendM()">Send</button></div><label><input type="checkbox" id="sp" ${speakOn?'checked':''} style="width:auto" onchange="speakOn=this.checked"> Speak replies</label>`}
if(tab==='tasks'){h+=`<div class="card"><textarea id="nt" rows="3" placeholder="e.g. 7 PM tak YouTube ke liye Top 5 AI Tools 2026 par research karke script tayyar karo"></textarea><button class="pri" style="width:100%;margin-top:8px" onclick="newT()">Create task</button></div>`+[...S.tasks].reverse().map(t=>`<div class="card"><b>${esc(t.title)}</b><small>${t.status} · ${(S.people[t.assignee]||{}).name||''} · ${t.progress}%</small><div class="bar"><i style="width:${t.progress}%"></i></div>${t.output?`<details><summary>Output</summary>${t.output.imageUrl?`<img src="${esc(t.output.imageUrl)}">`:''}<pre style="white-space:pre-wrap">${esc(t.output.text)}</pre></details>`:''}</div>`).join('')}
if(tab==='activity')h+=S.activity.slice(0,60).map(a=>`<div class="card"><small>${tm(a.t)} · ${a.kind}</small>${esc(a.text)}</div>`).join('')
if(tab==='schedule'){const d=new Date(),day=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');h+=`<h3>Daily</h3>`+S.schedule.base.map(e=>`<div class="card"><small>${e.time} · ${e.kind}</small>${esc(e.title)}</div>`).join('')+`<h3>Today (custom)</h3>`+(S.schedule.custom.filter(e=>e.date===day).map(e=>`<div class="card"><small>${e.time} · ${e.kind}${e.firedAt?' ✓':''}</small>${esc(e.title)}</div>`).join('')||'<small>None</small>')+`<div class="card"><div class="row"><input id="st" type="time" value="18:00"><select id="sk"><option>Task</option><option>Announcement</option><option>Meeting</option><option>Deadline</option></select></div><input id="sn" placeholder="What should happen?" style="margin-top:8px"><button class="pri" style="width:100%;margin-top:8px" onclick="addS('${day}')">Add for today</button></div>`}
if(document.activeElement&&['msg','nt','sn','pw'].includes(keep)&&v.innerHTML&&tab!=='overview'){const val=document.activeElement.value;v.innerHTML=h;const e=$('#'+keep);if(e){e.value=val;e.focus()}}else v.innerHTML=h
if(tab==='chat')window.scrollTo(0,document.body.scrollHeight)}
async function sendM(){const t=$('#msg').value.trim();if(!t)return;$('#msg').value='';await api('/api/chat',{conv,text:t})}
function mic(){const R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('Voice not supported in this browser');const r=new R();r.lang='hi-IN';r.onresult=e=>{$('#msg').value=e.results[0][0].transcript;sendM()};r.start()}
async function newT(){const t=$('#nt').value.trim();if(!t)return;$('#nt').value='';await api('/api/task',{title:t});tab='chat';draw()}
async function addS(day){const t=$('#sn').value.trim();if(!t)return;await api('/api/schedule',{date:day,time:$('#st').value,kind:$('#sk').value,title:t});$('#sn').value=''}
if(T)start()
</script></body></html>
